name = "votkp-lean"
version = "1.0.0"
defaultTargets = ["VOTKP", "Showcase"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "VOTKP"
globs = ["VOTKP.+"]

[[lean_lib]]
name = "Showcase"
roots = ["Showcase", "Showcase_WithProofs"]
