<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ballad of a Dead Photon — 3D mixer</title>
<meta name="description" content="3D mixer for the song Ballad of a Dead Photon by Jeromie Beasley: a photon's life from the Sun's core to a leaf, with every number recomputed live, and a closing scene driving out into the sunset.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
</head><body>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
/* SCRIPT: mixer3d_parts_v1
   3D Mixer Parts v1 — Jeromie Beasley — 27 Oct 2026
   The shared, hard-to-get-right 3D parts taken from the Colour Leader Engine:
   stage (three.js scene, dark void, orbit drag / pinch / wheel, auto-turn, resize, panel offset),
   glow particles, fading trails, lines, orbs, terrain surfaces, floating labels,
   colour science (spectrum to colour), and the instrument panel (feed, eyes in film order,
   Eye / Film / Clean / PNG).
   This is NOT a mixer. Each paper's mixer is written for that paper on top of these parts:
   its eyes are its own 3D scenes built from its own physics.
   Needs three.js r158 loaded first. */
(function(){
"use strict";
const T = window.THREE;

/* ---------- colour science (CIE 1931 fit, equal-energy white balanced) ---------- */
const g = (l,m,s1,s2) => { const t = (l-m)/(l<m?s1:s2); return Math.exp(-0.5*t*t); };
const WL = []; for(let l=400;l<=700;l+=10) WL.push(l);
const CMF = WL.map(l => [1.056*g(l,599.8,37.9,31.0)+0.362*g(l,442.0,16.0,26.7)-0.065*g(l,501.1,20.4,26.2),
                        0.821*g(l,568.8,46.9,40.5)+0.286*g(l,530.9,16.3,31.1),
                        1.217*g(l,437.0,11.8,36.0)+0.681*g(l,459.0,26.0,13.8)]);
const X2R = [[3.2406,-1.5372,-0.4986],[-0.9689,1.8758,0.0415],[0.0557,-0.2040,1.0570]];
const xyz2lin = v => X2R.map(r => r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
const specToXYZ = E => { const o=[0,0,0]; for(let i=0;i<WL.length;i++){ o[0]+=CMF[i][0]*E[i]; o[1]+=CMF[i][1]*E[i]; o[2]+=CMF[i][2]*E[i]; } return o; };
const WHITE = xyz2lin(specToXYZ(WL.map(()=>1)));
const colour = {
  WL, CMF,
  spec: E => xyz2lin(specToXYZ(E)).map((v,i) => v/WHITE[i]),
  enc: c => { c = Math.max(0,Math.min(1,c)); return c<=0.0031308 ? 12.92*c : 1.055*Math.pow(c,1/2.4)-0.055; },
  norm: v => { const m = Math.max(v[0],v[1],v[2],1e-9); return v.map(x => Math.max(0,x)/m); },
  lum: v => 0.2126*v[0]+0.7152*v[1]+0.0722*v[2]
};
colour.hex = v => '#'+v.map(x => Math.round(colour.enc(x)*255).toString(16).padStart(2,'0')).join('');
colour.wave = l => colour.norm(xyz2lin(CMF[WL.indexOf(l)]).map((v,i)=>v/WHITE[i]));
colour.ramp = t => { t = Math.max(0,Math.min(1,t)); const s = [[0.12,0.35,1.0],[0.25,0.85,1.0],[0.45,1.0,0.55],[1.0,0.78,0.25],[1.0,0.35,0.45]];
  const x = t*(s.length-1), i = Math.min(s.length-2, Math.floor(x)), f = x-i; return [0,1,2].map(k => s[i][k]*(1-f)+s[i+1][k]*f); };
const tcol = v => { const c = new T.Color(); c.setRGB(Math.max(0,v[0]),Math.max(0,v[1]),Math.max(0,v[2]), T.LinearSRGBColorSpace); return c; };

/* ---------- glow parts ---------- */
const sprite = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const gr = x.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.25,'rgba(255,255,255,.65)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0,0,64,64); return new T.CanvasTexture(c); })();
const glow = size => new T.PointsMaterial({size, map:sprite, transparent:true, depthWrite:false, blending:T.AdditiveBlending, vertexColors:true, sizeAttenuation:true});
function points(n, size){ const geo = new T.BufferGeometry(); geo.setAttribute('position', new T.BufferAttribute(new Float32Array(n*3),3)); geo.setAttribute('color', new T.BufferAttribute(new Float32Array(n*3),3)); const p = new T.Points(geo, glow(size)); p.frustumCulled = false; return p; }
function setPt(p, i, P, c){ const a = p.geometry.attributes; a.position.setXYZ(i, P.x, P.y, P.z); if(c) a.color.setXYZ(i, c[0], c[1], c[2]); }
function flush(p){ const a = p.geometry.attributes; a.position.needsUpdate = true; a.color.needsUpdate = true; }
function line(pts, color, opacity){ const geo = new T.BufferGeometry().setFromPoints(pts.length ? pts : [new T.Vector3(), new T.Vector3()]); const l = new T.Line(geo, new T.LineBasicMaterial({color, transparent:true, opacity:opacity==null?1:opacity})); l.frustumCulled = false; return l; }
function setLine(l, pts){ l.geometry.dispose(); l.geometry = new T.BufferGeometry().setFromPoints(pts); }
function orb(r, color){ return new T.Mesh(new T.SphereGeometry(r, 28, 20), new T.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.6, roughness:0.4})); }
function paintOrb(o, v, glowAmt){ const c = tcol(v); o.material.color = c; o.material.emissive = c; if(glowAmt != null) o.material.emissiveIntensity = glowAmt; }
function shell(r, color, opacity){ return new T.Mesh(new T.SphereGeometry(r, 36, 24), new T.MeshBasicMaterial({color, transparent:true, opacity, depthWrite:false, blending:T.AdditiveBlending})); }
function box(w, h, d, color, opacity){ return new T.Mesh(new T.BoxGeometry(w,h,d), new T.MeshStandardMaterial({color, transparent:true, opacity:opacity==null?0.35:opacity, roughness:0.15, depthWrite:false})); }
function grid(size, n, color, opacity){ const pts = []; const h = size/2; for(let i=0;i<=n;i++){ const t = -h + size*i/n; pts.push(new T.Vector3(t,0,-h), new T.Vector3(t,0,h), new T.Vector3(-h,0,t), new T.Vector3(h,0,t)); }
  return new T.LineSegments(new T.BufferGeometry().setFromPoints(pts), new T.LineBasicMaterial({color, transparent:true, opacity})); }

/* fading trail: a ring buffer of n glowing points */
function trail(n, size){ const p = points(n, size); p.userData = {n, i:0, filled:0}; return p; }
function pushTrail(p, P, c){ const u = p.userData, a = p.geometry.attributes;
  a.position.setXYZ(u.i, P.x, P.y, P.z); u.i = (u.i+1) % u.n; u.filled = Math.min(u.n, u.filled+1);
  for(let k=0;k<u.n;k++){ const age = ((u.i - 1 - k) % u.n + u.n) % u.n; const f = k < u.filled ? Math.pow(1 - age/u.n, 2)*0.85 : 0; a.color.setXYZ(k, c[0]*f, c[1]*f, c[2]*f); }
  a.position.needsUpdate = a.color.needsUpdate = true; }
function clearTrail(p){ p.userData.i = 0; p.userData.filled = 0; const a = p.geometry.attributes; a.color.array.fill(0); a.color.needsUpdate = true; }

/* terrain surface over a grid: H[a][b] heights, C[a][b] rgb; spans x in [-sx,sx], z in [-sz,sz] */
function surface(N, M, sx, sz){ const geo = new T.PlaneGeometry(2*sx, 2*sz, N-1, M-1); geo.rotateX(-Math.PI/2);
  geo.setAttribute('color', new T.BufferAttribute(new Float32Array(N*M*3),3));
  const mesh = new T.Mesh(geo, new T.MeshStandardMaterial({vertexColors:true, roughness:0.55, metalness:0.05, side:T.DoubleSide, transparent:true, opacity:0.92}));
  const wire = new T.LineSegments(new T.WireframeGeometry(geo), new T.LineBasicMaterial({color:0x63d3ff, transparent:true, opacity:0.08}));
  const grp = new T.Group(); grp.add(mesh); grp.add(wire); grp.userData = {N, M, sx, sz, geo, wire}; return grp; }
function setSurface(s, H, C){ const u = s.userData, pos = u.geo.attributes.position, col = u.geo.attributes.color;
  for(let b=0;b<u.M;b++) for(let a=0;a<u.N;a++){ const i = b*u.N + a; pos.setY(i, H[a][u.M-1-b]); const c = C[a][u.M-1-b]; col.setXYZ(i, c[0], c[1], c[2]); }
  pos.needsUpdate = col.needsUpdate = true; u.geo.computeVertexNormals();
  u.wire.geometry.dispose(); u.wire.geometry = new T.WireframeGeometry(u.geo); }

/* floating text label (always faces the camera) */
function label(text, color, scale){ const c = document.createElement('canvas'), x = c.getContext('2d'), f = 44;
  x.font = `500 ${f}px "Inter Tight",system-ui,sans-serif`; const w = Math.ceil(x.measureText(text).width) + 24; c.width = w; c.height = f + 20;
  x.font = `500 ${f}px "Inter Tight",system-ui,sans-serif`; x.fillStyle = color || '#b8c6d6'; x.textBaseline = 'middle'; x.fillText(text, 12, c.height/2);
  const tex = new T.CanvasTexture(c); tex.colorSpace = T.SRGBColorSpace;
  const s = new T.Sprite(new T.SpriteMaterial({map:tex, transparent:true, depthWrite:false, depthTest:false}));
  const k = 0.55*(scale || 0.32) / f; s.scale.set(w*k, c.height*k, 1); s.renderOrder = 10; return s; }

/* ---------- stage ---------- */
function stage(canvas){
  const renderer = new T.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
  const scene = new T.Scene(); scene.background = new T.Color(0x05070b);
  const camera = new T.PerspectiveCamera(45, 1, 0.05, 200);
  const world = new T.Group(); scene.add(world);
  scene.add(new T.AmbientLight(0x8899aa, 0.6));
  const key = new T.DirectionalLight(0xffffff, 1.0); key.position.set(3,5,4); scene.add(key);
  const V = { yaw:0.75, pitch:0.42, dist:7.2, ty:0.4, auto:true, panel:true };
  function size(){ const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix();
    const mobile = w < 640; if(V.panel) camera.setViewOffset(w, h, mobile ? 0 : -Math.min(180, w*0.14), mobile ? h*0.2 : 0, w, h); else camera.clearViewOffset(); }
  window.addEventListener('resize', size);
  const ptrs = new Map(); let pinch0 = 0, dist0 = V.dist;
  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); V.auto = false;
    if(ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x-b.x, a.y-b.y); dist0 = V.dist; } });
  canvas.addEventListener('pointermove', e => { if(!ptrs.has(e.pointerId)) return; const p = ptrs.get(e.pointerId);
    if(ptrs.size === 1){ V.yaw -= (e.clientX - p.x)*0.006; V.pitch = Math.max(-1.3, Math.min(1.3, V.pitch + (e.clientY - p.y)*0.006)); }
    p.x = e.clientX; p.y = e.clientY;
    if(ptrs.size === 2){ const [a,b] = [...ptrs.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y); if(pinch0) V.dist = Math.max(3, Math.min(20, dist0*pinch0/d)); } });
  ['pointerup','pointercancel'].forEach(t => canvas.addEventListener(t, e => { ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch0 = 0; }));
  canvas.addEventListener('wheel', e => { e.preventDefault(); V.dist = Math.max(3, Math.min(20, V.dist*Math.exp(e.deltaY*0.001))); }, {passive:false});
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = performance.now(), tick = null;
  function frame(now){
    const dt = Math.min(0.05, (now - last)/1000); last = now;
    if(V.auto && !still) V.yaw += dt*0.08;
    const D = V.dist*(window.innerWidth < 640 ? 1.5 : 1);
    camera.position.set(D*Math.cos(V.pitch)*Math.sin(V.yaw), V.ty + D*Math.sin(V.pitch), D*Math.cos(V.pitch)*Math.cos(V.yaw));
    camera.lookAt(0, V.ty, 0);
    if(tick) tick(still ? 0.016 : dt, now/1000);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  size();
  return { T, scene, camera, renderer, world, view:V, resize:size,
    onFrame(fn){ tick = fn; requestAnimationFrame(frame); },
    setView(v){ V.yaw = v[0]; V.pitch = v[1]; V.dist = v[2]; V.ty = v[3] == null ? 0.4 : v[3]; } };
}

/* ---------- instrument panel CSS ---------- */
const CSS = `
:root{--void:#05070b;--panel:rgba(9,13,20,.86);--edge:#1f2a38;--ink:#dfe7ef;--dim:#8a9aab;--faint:#55657a;--gold:#f2c14e;--cyan:#63d3ff;--rose:#ff6fae;
--head:"Chakra Petch","Segoe UI",system-ui,sans-serif;--body:"Inter Tight",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
html,body{height:100%}body{margin:0;background:var(--void);color:var(--ink);font-family:var(--body);font-size:13.5px;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}#stage:active{cursor:grabbing}
.panel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:350px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:14px 14px 12px;backdrop-filter:blur(6px);display:grid;gap:10px}
@media (max-width:640px){.panel{top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;max-height:46%}}
body.clean .panel{display:none}
.cleanexit{position:fixed;right:12px;bottom:12px;display:none;font-size:11px;opacity:.35}body.clean .cleanexit{display:block}
h1{font-family:var(--head);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;margin:0}
.by{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em;margin-top:2px}
button{font:inherit;color:var(--ink);background:#101824;border:1px solid var(--edge);border-radius:5px;padding:6px 8px;cursor:pointer}
button:hover{border-color:var(--cyan)}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.eyes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
.eyes button{font-family:var(--head);font-size:11.5px;letter-spacing:.03em;line-height:1.25;text-align:left;display:flex;gap:6px;align-items:baseline}
.eyes button .n{font-family:var(--mono);color:var(--faint);font-size:10.5px}
.eyes button.on{border-color:var(--gold);color:var(--gold)}.eyes button.on .n{color:var(--gold)}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.05em}.tag b{color:var(--cyan);font-weight:400}
.eq{font-family:var(--mono);font-size:12px;color:var(--gold);line-height:1.55;white-space:pre-wrap}
.what{color:var(--dim);line-height:1.45;margin:0}
.ctl{display:grid;gap:7px}
.ctl label{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:12px;color:var(--dim)}
.ctl label output{font-family:var(--mono);color:var(--ink)}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--cyan)}
.row{display:flex;flex-wrap:wrap;gap:6px}.row button{font-size:12px;padding:4px 9px}
.row button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.read{font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--dim);border-top:1px solid var(--edge);padding-top:8px;font-variant-numeric:tabular-nums}
.read div{display:flex;justify-content:space-between;gap:10px}.read b{color:var(--ink);font-weight:400;text-align:right}
.filmbar{height:3px;background:var(--edge);border-radius:2px;overflow:hidden}.filmbar i{display:block;height:100%;width:0;background:var(--gold)}
.hint{font-size:11px;color:var(--faint)}`;

/* ---------- mixer runner: feed operator + eyes (each its own 3D scene) + film ---------- */
function run(MIXER){
  const st = document.createElement('style'); st.textContent = CSS; document.head.append(st);
  document.body.insertAdjacentHTML('beforeend', `
<canvas id="stage" aria-label="3D view; drag to turn, scroll or pinch to zoom"></canvas>
<div class="panel" id="panel">
  <div><h1>${MIXER.title}</h1><div class="by">${MIXER.byline}</div></div>
  <div class="eyes" id="eyes" role="tablist"></div>
  <div class="tag" id="tag"></div>
  <div class="eq" id="eq"></div>
  <p class="what" id="what"></p>
  <div class="ctl" id="ctl"></div>
  <div class="read" id="read"></div>
  <div class="row"><button id="m_eye" aria-pressed="true">Eye</button><button id="m_film" aria-pressed="false">Film</button><button id="m_clean">Clean view</button><button id="m_png">Frame PNG</button></div>
  <div class="ctl"><label>Seconds per eye (film) <output id="o_sec">10</output><input id="sec" type="range" min="4" max="30" step="1" value="10"></label></div>
  <div class="filmbar"><i id="fb"></i></div>
  <div class="hint">Drag to turn · scroll or pinch to zoom · ${MIXER.note || ''}</div>
</div>
<button class="cleanexit" id="m_back">show panel</button>`);
  const $ = id => document.getElementById(id);
  const S3 = stage($('stage'));
  const P = {}; MIXER.feed.params.forEach(q => P[q.id] = q.value);
  let S = MIXER.feed.build(P);
  const byId = {}; MIXER.eyes.forEach(e => { byId[e.id] = e; e.group = new T.Group(); e.make(e.group, S3); });
  let cur = null, mode = 'eye', t0 = 0, fi = 0, tEye = 0;
  function controls(e){
    const used = (e.uses || []).map(id => MIXER.feed.params.find(q => q.id === id));
    $('ctl').innerHTML = used.map(q => `<label>${q.label} <output id="o_${q.id}">${P[q.id]}</output><input id="p_${q.id}" type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${P[q.id]}"></label>`).join('') + (e.extra ? e.extra() : '');
    used.forEach(q => $('p_'+q.id).addEventListener('input', ev => { P[q.id] = +ev.target.value; $('o_'+q.id).textContent = P[q.id]; S = MIXER.feed.build(P); if(cur.change) cur.change(S); }));
    if(e.bind) e.bind(S, $);
  }
  function show(id){
    if(cur) S3.world.remove(cur.group);
    cur = byId[id]; S3.world.add(cur.group); tEye = 0;
    document.querySelectorAll('#eyes button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
    $('tag').innerHTML = `${cur.section} · <b>${cur.grade}</b>`;
    $('eq').textContent = cur.eq; $('what').textContent = cur.text;
    controls(cur); S3.setView(cur.view || [0.75,0.42,7.2,0.4]);
    if(cur.enter) cur.enter(S);
  }
  MIXER.film.forEach((id,i) => { const b = document.createElement('button'); b.dataset.id = id; b.setAttribute('role','tab');
    b.innerHTML = `<span class="n">${i+1}</span><span>${byId[id].title}</span>`; b.addEventListener('click', () => { if(mode==='film') setMode('eye'); show(id); }); $('eyes').append(b); });
  function setMode(m){ mode = m; $('m_eye').setAttribute('aria-pressed', m==='eye'); $('m_film').setAttribute('aria-pressed', m==='film'); t0 = performance.now()/1000; if(m==='film'){ fi = 0; show(MIXER.film[0]); } }
  $('m_eye').addEventListener('click', () => setMode('eye'));
  $('m_film').addEventListener('click', () => setMode('film'));
  $('sec').addEventListener('input', e => $('o_sec').textContent = e.target.value);
  const clean = on => { document.body.classList.toggle('clean', on); S3.view.panel = !on; S3.resize(); };
  $('m_clean').addEventListener('click', () => clean(true)); $('m_back').addEventListener('click', () => clean(false));
  document.addEventListener('keydown', e => { if(e.key === 'Escape') clean(false); });
  $('m_png').addEventListener('click', () => { const a = document.createElement('a'); a.href = $('stage').toDataURL('image/png'); a.download = (MIXER.title + ' ' + cur.id).replace(/\s+/g,'_') + '.png'; a.click(); });
  let readT = 0;
  S3.onFrame((dt, now) => {
    tEye += dt;
    if(mode === 'film'){ const sec = +$('sec').value, t = now - t0; if(t > sec){ fi = (fi+1) % MIXER.film.length; t0 = now; show(MIXER.film[fi]); } $('fb').style.width = (100*(fi + Math.min(1,(now-t0)/sec))/MIXER.film.length) + '%'; }
    else $('fb').style.width = '0%';
    const rows = cur.step(dt, S, tEye);
    readT += dt; if(rows && readT > 0.12){ readT = 0; $('read').innerHTML = rows.map(r => `<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join(''); }
  });
  show(MIXER.film[0]);
  window.MIXER_API = { show, setMode, clean, P, get S(){ return S; },
    set(id, v){ P[id] = v; S = MIXER.feed.build(P); const i = $('p_'+id); if(i){ i.value = v; $('o_'+id).textContent = v; } if(cur.change) cur.change(S); } };
}

window.Mixer3D = { T, colour, tcol, sprite, glow, points, setPt, flush, line, setLine, orb, paintOrb, shell, box, grid, trail, pushTrail, clearTrail, surface, setSurface, label, stage, run };
})();

</script>
<script>
/* SCRIPT: PHOTON-MIXER-CORE
   Physics core of the Ballad of a Dead Photon mixer (Jeromie Beasley). Every number an eye shows is computed here.
   SI units unless stated. Runs in the browser and in Node. */
(function(root){
"use strict";
const c = 299792458, h = 6.62607015e-34, e = 1.602176634e-19, kB = 1.380649e-23;
const HC_EV_NM = h*c/e*1e9;                 /* 1239.84198 eV nm */
const R_SUN = 6.957e8, AU = 1.495978707e11, YEAR = 3.15576e7, T_SUN = 5772;

const walk = l => { const N = (R_SUN/l)**2; return { N, t: R_SUN*R_SUN/(l*c), years: R_SUN*R_SUN/(l*c)/YEAR, straight: R_SUN/c }; };
/* 2. Sun to Earth */
const flight = () => ({ t: AU/c, minutes: AU/c/60, proper: 0 });
/* photon energy and momentum */
const energyEV = lam_nm => HC_EV_NM/lam_nm;
const freq = lam_nm => c/(lam_nm*1e-9);
/* 3. Snell, critical angle, evanescent 1/e depth of the field (intensity depth is half of it) */
function snell(n1, n2, th1){ const s = n1*Math.sin(th1)/n2;
  if(s <= 1) return { tir:false, th2: Math.asin(s) };
  return { tir:true, thc: Math.asin(n2/n1) }; }

function slitI(y, lam, d, a, L){ const u = Math.PI*d*y/(lam*L), v = Math.PI*a*y/(lam*L); const s = Math.abs(v) < 1e-12 ? 1 : Math.sin(v)/v; return Math.cos(u)**2 * s*s; }
const fringe = (lam, d, L) => lam*L/d;
/* 5. cosmological redshift: lam_obs = (1+z) lam_emit, E_obs = E_emit/(1+z) */
const redshift = (lam_nm, z) => ({ lam: lam_nm*(1+z), E: energyEV(lam_nm)/(1+z), stretch: 1+z });
/* 6. photoelectric effect: K_max = h f - phi, threshold lam_0 = hc/phi */
const photoelectric = (lam_nm, phi) => { const E = energyEV(lam_nm); return { E, K: Math.max(0, E - phi), emits: E > phi, lam0: HC_EV_NM/phi }; };
/* 7. chlorophyll a absorption, approximate shape (two bands near 430 nm and 662 nm in solution); illustrative, not data */
const chlA = lam => 1.0*Math.exp(-0.5*((lam-430)/16)**2) + 0.78*Math.exp(-0.5*((lam-662)/11)**2) + 0.06*Math.exp(-0.5*((lam-615)/18)**2) + 0.05*Math.exp(-0.5*((lam-560)/60)**2);

const tauRayleigh = lam_nm => { const u = lam_nm/1000; return 0.008569*u**-4*(1 + 0.0113*u**-2 + 0.00013*u**-4); };   /* Hansen & Travis 1974 */
const airmass = h_deg => 1/(Math.sin(h_deg*Math.PI/180) + 0.50572*Math.pow(h_deg + 6.07995, -1.6364));               /* Kasten & Young 1989 */

<script>

function clear(g){ while(g.children.length){ const c = g.children.pop(); c.traverse(o => { if(o.geometry) o.geometry.dispose(); }); } }

/* ---------- feed operator ---------- */
const MIXER = {
  title: 'Ballad of a Dead Photon',
  byline: 'Jeromie Beasley · 3D mixer for the song · physics recomputed live',
  note: 'Film plays the photon’s life in order.',
  feed: {

      {id:'lmfp', label:'Mean free path in the Sun, log₁₀ m', min:-5, max:-1, step:0.1, value:-3},

      {id:'dsl',  label:'Slit separation (micrometres)', min:20, max:300, step:5, value:100},
      {id:'z',    label:'Redshift z', min:0, max:3, step:0.01, value:0.5},
      {id:'phi',  label:'Work function of the metal (eV)', min:1.5, max:5, step:0.05, value:2.3},
      {id:'elev', label:'Sun elevation (degrees)', min:-1, max:40, step:0.5, value:4},

    ],
    build(P){
      const lam = P.lam, l = Math.pow(10, P.lmfp), th = P.th*Math.PI/180;
      return { lam, rgb: lamRGB(lam), E: K.energyEV(lam), walk: K.walk(l), l, th, n1: P.n1,
        sn: K.snell(P.n1, 1.0, th), thc: K.critical(P.n1, 1.0), dep: K.evanescentDepth(lam, P.n1, 1.0, th), R: K.fresnelR(P.n1, 1.0, th),
        d: P.dsl*1e-6, z: P.z, rs: K.redshift(lam, P.z), phi: P.phi, pe: K.photoelectric(lam, P.phi), absorb: K.chlA(lam),

  eyes: [], film: ['core','flight','snell','slits','redshift','photoelectric','leaf','sunset']

/* ---------- 1. random walk out of the Sun ---------- */
MIXER.eyes.push({ id:'core', section:'I · Born in the core', grade:'estimate (random walk)', title:'Random walk out of the Sun',
  eq:'⟨r²⟩ = N ℓ²   ⇒   N ≈ (R/ℓ)²\nt ≈ N ℓ / c = R² / (ℓ c)',
  text:'In the dense interior a photon is absorbed and re-emitted in a new direction after a short free path ℓ. After N steps its distance from the centre grows only as √N ℓ, so leaving the Sun takes about (R/ℓ)² steps. The real free path changes with depth, so the time is an order of magnitude, not a fixed number.',
  uses:['lmfp','lam'], view:[0.6,0.35,8.5,0],
  make(G){
    this.R = 2.4;
    G.add(M.shell(this.R, 0xff9a3c, 0.10)); G.add(M.shell(this.R*0.55, 0xffd27a, 0.18)); G.add(M.shell(this.R*0.25, 0xfff3c4, 0.35));
    const ring = []; for(let i=0;i<=128;i++){ const a=2*Math.PI*i/128; ring.push(V3(this.R*Math.cos(a),0,this.R*Math.sin(a))); }
    G.add(M.line(ring, 0xffb347, 0.35));
    this.tr = M.trail(900, 0.07); G.add(this.tr); this.ph = glowSprite(0.32, [1,1,1]); G.add(this.ph);
    this.out = M.line([V3(),V3()], 0xffffff, 0.0); G.add(this.out);
    const lb = M.label('surface', '#ffcf7a', 0.28); lb.position.set(0, this.R+0.25, 0); G.add(lb);

  enter(S){ base(); this.p.set(0,0,0); this.steps = 0; this.esc = 0; M.clearTrail(this.tr); },
  step(dt, S){
    const stepVis = 0.06 + 0.05*(S.l > 1e-3 ? 1 : 0.6);

    while(this.acc > 0.012 && !this.esc){ this.acc -= 0.012;

  }});

/* ---------- 2. eight minutes to the Earth ---------- */
MIXER.eyes.push({ id:'flight', section:'II · Eight minutes', grade:'standard physics, recomputed', title:'Eight minutes to the Earth',
  eq:'t = 1 AU / c = 499.0 s\nalong a light path  dτ² = dt² − dx²/c² = 0',
  text:'Leaving the surface, the photon crosses one astronomical unit in 499 seconds of Earth time. Along its own path the elapsed proper time is zero: a clock cannot ride with light, so in the photon’s terms emission and absorption have no time between them.',
  uses:['lam'], view:[0.0,0.25,10,0],
  make(G){
    const sun = M.orb(1.0, 0xffb347); sun.position.set(-5,0,0); G.add(sun); const sg = glowSprite(4.5,[1,0.7,0.3],0.8); sg.position.set(-5,0,0); G.add(sg);
    const earth = new T.Mesh(new T.SphereGeometry(0.28,32,20), new T.MeshStandardMaterial({color:0x2f6fd6, emissive:0x0b2a66, emissiveIntensity:.5, roughness:.6})); earth.position.set(5,0,0); G.add(earth);
    for(let m=0;m<=8;m++){ const x = -4 + 9*m/8.3165; const tk = M.line([V3(x,-0.5,0),V3(x,-0.35,0)], 0x55657a, 0.9); G.add(tk);
      if(m%2===0){ const lb = M.label(m+' min', '#8a9aab', 0.22); lb.position.set(x,-0.7,0); G.add(lb); } }

  },
  enter(){ base(); this.t = 0; },
  step(dt, S){
    this.t += dt; const T8 = 8.3165, frac = (this.t % (T8*0.9)) / (T8*0.9), x0 = -4 + 9*frac;
    const pts = []; const k = 2*Math.PI/(0.12 + 0.0006*(S.lam-400));

/* ---------- 3. Snell and total internal reflection ---------- */
MIXER.eyes.push({ id:'snell', section:'III · Bent at the glass', grade:'standard physics, recomputed', title:'Refraction and total internal reflection',
  eq:'n₁ sin θ₁ = n₂ sin θ₂\nθc = arcsin(n₂/n₁)\npast θc:  field ∝ exp(−z/δ),  δ = λ / (2π √(n₁² sin²θ₁ − n₂²))',

  uses:['th','n1','lam'], view:[0.0,0.05,8,0],
  make(G){
    const glass = new T.Mesh(new T.BoxGeometry(8,2.4,2.4), new T.MeshStandardMaterial({color:0x2d5d8a, transparent:true, opacity:0.22, roughness:0.05, metalness:0.1, depthWrite:false}));
    glass.position.set(0,1.2,0); G.add(glass);
    G.add(M.line([V3(-4,0,1.2),V3(4,0,1.2)], 0x63d3ff, 0.6)); G.add(M.line([V3(0,-2.4,0),V3(0,2.4,0)], 0x55657a, 0.5));
    const lg = M.label('glass  n₁', '#8fc7ff', 0.26); lg.position.set(-3.1,2.1,0); G.add(lg); const la = M.label('air  n₂ = 1', '#8a9aab', 0.26); la.position.set(-3.1,-0.4,0); G.add(la);
    this.inc = M.line([V3(),V3()], 0xffffff, 1); this.ref = M.line([V3(),V3()], 0xffffff, 1); this.tra = M.line([V3(),V3()], 0xffffff, 1); G.add(this.inc, this.ref, this.tra);
    this.ev = M.points(600, 0.06); G.add(this.ev); this.ph = glowSprite(0.3,[1,1,1]); G.add(this.ph); this.t = 0;
  },
  enter(){ base(); },
  step(dt, S){
    this.t += dt; const th = S.th, L = 3.2, s = Math.sin(th), c = Math.cos(th), col = S.rgb;
    const A = V3(-L*s, L*c, 0), O = V3(0,0,0);
    M.setLine(this.inc, [A, O]); M.setLine(this.ref, [O, V3(L*s, L*c, 0)]);
    this.inc.material.color.setRGB(...col); this.ref.material.color.setRGB(...col); this.ref.material.opacity = 0.25 + 0.75*S.R;
    const ev = this.ev.geometry.attributes; let n = 0;
    if(!S.sn.tir){ const t2 = S.sn.th2; M.setLine(this.tra, [O, V3(L*Math.sin(t2), -L*Math.cos(t2), 0)]); this.tra.material.opacity = 0.25 + 0.75*(1-S.R); this.tra.material.color.setRGB(...col); }
    else this.tra.material.opacity = 0;
    if(S.sn.tir){ const dVis = Math.min(1.2, 0.25*S.dep/100); for(let i=0;i<600;i++){ const x = -2.5 + 5*(i%60)/59, zz = -(Math.floor(i/60))*0.06, a = Math.exp(zz/dVis)*(0.5+0.5*Math.cos(6*x - 4*this.t));

  }});

/* ---------- 4. double slit ---------- */
MIXER.eyes.push({ id:'slits', section:'IV · Both ways', grade:'standard physics, recomputed', title:'Two slits, one photon at a time',

  uses:['lam','dsl'], view:[0.9,0.25,9,0],
  make(G){
    const wall = new T.Mesh(new T.BoxGeometry(0.12,3,3), new T.MeshStandardMaterial({color:0x1b2635, roughness:.8})); wall.position.set(-2,0,0); G.add(wall);

    const scr = new T.Mesh(new T.PlaneGeometry(3,3), new T.MeshStandardMaterial({color:0x0c121c, roughness:.9, side:T.DoubleSide})); scr.rotation.y = Math.PI/2; scr.position.set(3,0,0); G.add(scr);

  },

/* ---------- 5. cosmological redshift ---------- */
MIXER.eyes.push({ id:'redshift', section:'V · The long commute', grade:'standard physics, recomputed', title:'Stretched by the expansion',
  eq:'λ_observed = (1 + z) λ_emitted\nE_observed = E_emitted / (1 + z)',
  text:'Crossing an expanding universe, the wave is stretched by the same factor as the space it travels through. The photon arrives redder and with less energy; nothing is lost along the way in the local sense, the stretch belongs to the expansion.',
  uses:['z','lam'], view:[0.4,0.3,9.5,0],
  make(G){ this.grid = M.grid(8, 16, 0x1f2a38, 0.55); G.add(this.grid); this.wave = M.line([V3(),V3()], 0xffffff, 1); G.add(this.wave); this.gal = [];
    for(let i=0;i<14;i++){ const g = glowSprite(0.25, [0.6,0.7,1], 0.7); g.userData.p = V3((Math.random()-.5)*8, 0.05, (Math.random()-.5)*8); this.gal.push(g); G.add(g); } this.t = 0; },
  enter(){ base(); this.t = 0; },
  step(dt, S){
    this.t += dt; const u = (this.t % 7)/7, a = 1 + S.z*u;

    return [['redshift z', f(S.z,2)], ['scale factor now / at emission', f(a,3)], ['wavelength now', f(lamNow,0)+' nm  ('+lamHex(lamNow)+')'],
      ['wavelength on arrival', f(S.rs.lam,0)+' nm'], ['energy on arrival', f(S.rs.E,3)+' eV  (was '+f(S.E,3)+')']];
  }});

/* ---------- 6. photoelectric effect ---------- */
MIXER.eyes.push({ id:'photoelectric', section:'VI · Paid in full', grade:'standard physics, recomputed', title:'Absorbed: the photoelectric effect',

  text:'At a metal surface the photon gives up all of its energy to one electron. If h f exceeds the work function φ the electron leaves with the remainder as kinetic energy; below threshold no electron leaves, however bright the light. Einstein’s 1905 explanation of this is what the 1921 Nobel Prize cited.',

  make(G){ const slab = new T.Mesh(new T.BoxGeometry(4,0.5,2.6), new T.MeshStandardMaterial({color:0x8d97a6, metalness:0.9, roughness:0.25})); slab.position.set(0,-0.25,0); G.add(slab);
    this.ph = glowSprite(0.4,[1,1,1]); G.add(this.ph); this.el = M.orb(0.09, 0x63d3ff); G.add(this.el); this.tr = M.trail(120, 0.06); G.add(this.tr); this.t = 0; },

/* ---------- 8. the closing scene: out into the sunset ---------- */
const DURAG_SUN = '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-256 -256 512 512"><circle r="195" fill="#ffffff"/><path d="M-178,-40 C-170,-160 -80,-205 0,-205 C80,-205 170,-160 178,-40 C120,-62 60,-70 0,-70 C-60,-70 -120,-62 -178,-40 Z" fill="#f4f4f2"/><path d="M-178,-40 C-120,-62 -60,-70 0,-70 C60,-70 120,-62 178,-40 L174,-22 C118,-44 58,-52 0,-52 C-58,-52 -118,-44 -174,-22 Z" fill="#dcdcd8"/><path d="M0,-205 L0,-75" stroke="#cfcfca" stroke-width="5"/><path d="M150,-60 C200,-30 215,40 205,120 C200,160 190,190 175,215 L150,205 C168,170 178,120 180,70 C182,20 170,-20 140,-45 Z" fill="#f4f4f2"/><path d="M175,-55 C225,-15 245,60 240,140 L215,138 C218,70 205,10 160,-40 Z" fill="#e4e4e0"/><path d="M-115,-28 L-30,-6" stroke="#4a2306" stroke-width="13" stroke-linecap="round"/><path d="M115,-28 L30,-6" stroke="#4a2306" stroke-width="13" stroke-linecap="round"/><path d="M-108,22 C-90,6 -50,6 -32,20 C-50,30 -90,32 -108,22 Z" fill="#ffffff"/><path d="M108,22 C90,6 50,6 32,20 C50,30 90,32 108,22 Z" fill="#ffffff"/><circle cx="-62" cy="20" r="9" fill="#2a1403"/><circle cx="62" cy="20" r="9" fill="#2a1403"/><path d="M-12,40 C-6,62 -10,74 -20,80 M12,40 C6,62 10,74 20,80" fill="none" stroke="#c98a2a" stroke-width="5" stroke-linecap="round"/><path d="M-55,118 C-30,108 30,108 55,118" fill="none" stroke="#4a2306" stroke-width="9" stroke-linecap="round"/></svg>';
function svgTexture(svg){ const tex = new T.Texture(); const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 512; c.getContext('2d').drawImage(img,0,0,512,512); tex.image = c; tex.colorSpace = T.SRGBColorSpace; tex.needsUpdate = true; };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); return tex; }
function palm(h){ const g = new T.Group(), mat = new T.MeshStandardMaterial({color:0x140a12, roughness:1});
  let p = V3(0,0,0); const lean = (Math.random()-.5)*0.5;
  for(let i=0;i<8;i++){ const q = p.clone().add(V3(lean*0.12*i, h/8, 0)); g.add(rod(p, q, 0x140a12, 0.07 - 0.004*i)); p = q; }
  for(let k=0;k<7;k++){ const a = 2*Math.PI*k/7, fr = new T.Mesh(new T.ConeGeometry(0.18, 1.6, 4, 1), mat); fr.scale.set(1,1,0.2);
    fr.position.copy(p).add(V3(0.6*Math.cos(a), -0.15, 0.6*Math.sin(a))); fr.rotation.set(0, -a, Math.PI/2 + 0.45); fr.rotateOnAxis(V3(0,1,0), 0); g.add(fr); }
  return g; }
function lowrider(){
  const car = new T.Group(), body = new T.Group(); car.add(body);
  const paint = new T.MeshStandardMaterial({color:0x5b1f7a, metalness:0.7, roughness:0.22, emissive:0x1a0624, emissiveIntensity:0.4});
  const chrome = new T.MeshStandardMaterial({color:0xe9eef5, metalness:1, roughness:0.08});
  const glass = new T.MeshStandardMaterial({color:0x0b0f18, metalness:0.3, roughness:0.05, transparent:true, opacity:0.45, depthWrite:false});
  const b = (w,h,d,m,x,y,z) => { const o = new T.Mesh(new T.BoxGeometry(w,h,d), m); o.position.set(x,y,z); body.add(o); return o; };
  b(1.9,0.42,4.8,paint, 0,0.42,0);                     /* lower body */
  b(1.86,0.12,1.7,paint, 0,0.69,-1.45);                /* hood */
  b(1.86,0.12,1.2,paint, 0,0.69,1.75);                 /* trunk deck */
  b(1.7,0.5,1.9,glass, 0,0.92,0.25);                   /* cabin glass */
  b(1.74,0.07,1.95,paint, 0,1.19,0.25);                /* roof */
  b(2.0,0.12,0.12,chrome, 0,0.3,-2.44); b(2.0,0.12,0.12,chrome, 0,0.3,2.44);       /* bumpers */
  b(0.05,0.05,4.6,chrome, 0.96,0.5,0); b(0.05,0.05,4.6,chrome, -0.96,0.5,0);      /* side trim */
  const tl = new T.MeshStandardMaterial({color:0xff2a2a, emissive:0xff2a2a, emissiveIntensity:1.2});
  b(0.4,0.12,0.04,tl, 0.65,0.5,2.42); b(0.4,0.12,0.04,tl, -0.65,0.5,2.42);
  const hl = new T.MeshStandardMaterial({color:0xfff2c4, emissive:0xfff2c4, emissiveIntensity:1.0});
  b(0.3,0.14,0.04,hl, 0.6,0.46,-2.42); b(0.3,0.14,0.04,hl, -0.6,0.46,-2.42);
  const driver = glowSprite(1.1, [1,1,1]); driver.position.set(-0.4, 1.02, 0.15); driver.renderOrder = 5; body.add(driver);
  const wheels = [];
  for(const [x,z] of [[0.92,-1.55],[-0.92,-1.55],[0.92,1.55],[-0.92,1.55]]){
    const w = new T.Group(); w.position.set(x,0.33,z);
    const tire = new T.Mesh(new T.CylinderGeometry(0.33,0.33,0.24,28), new T.MeshStandardMaterial({color:0x0b0b0e, roughness:0.9})); tire.rotation.z = Math.PI/2; w.add(tire);
    const ww = new T.Mesh(new T.TorusGeometry(0.24,0.045,10,32), new T.MeshStandardMaterial({color:0xf4f4f2, roughness:0.5})); ww.rotation.y = Math.PI/2; ww.position.x = Math.sign(x)*0.125; w.add(ww);
    const hub = new T.Group(); hub.position.x = Math.sign(x)*0.13;
    for(let s=0;s<12;s++){ const sp = new T.Mesh(new T.BoxGeometry(0.01,0.36,0.012), chrome); sp.rotation.x = Math.PI*s/12; hub.add(sp); }
    const cap = new T.Mesh(new T.CylinderGeometry(0.06,0.06,0.04,16), chrome); cap.rotation.z = Math.PI/2; hub.add(cap); w.add(hub);
    car.add(w); wheels.push(w); }
  car.userData = {body, wheels, driver}; return car; }
const skyVS = 'varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }';
const skyFS = 'uniform vec3 top; uniform vec3 hor; uniform vec3 sunC; uniform vec3 sunD; varying vec3 vW; void main(){ vec3 d = normalize(vW); float h = max(d.y, 0.0); vec3 c = mix(hor, top, pow(h, 0.55)); float g = max(dot(d, sunD), 0.0); c += sunC*(0.55*pow(g, 18.0) + 0.25*pow(g, 3.0)); if(d.y < 0.0) c = mix(hor*0.55, vec3(0.04,0.02,0.05), min(1.0, -d.y*8.0)); gl_FragColor = vec4(c, 1.0); }';
MIXER.eyes.push({ id:'sunset', section:'VIII · Out into the sunset', grade:'standard physics, recomputed (closing scene)', title:'Out into the sunset',
  eq:'sunlight seen = Planck(5772 K) × exp(−τ_R(λ) X)\nτ_R ∝ λ⁻⁴ (Rayleigh),  X = airmass at elevation h',
  text:'The closing scene of the song. The colour of the setting Sun is computed: the Sun’s Planck spectrum is dimmed by Rayleigh scattering through the air it crosses, which grows as the Sun sinks. Short wavelengths are scattered out of the beam first, so the low Sun turns orange and then red.',
  uses:['elev','hop'], view:[0.0,0.12,9.5,1.0],
  make(G){
    this.sky = new T.Mesh(new T.SphereGeometry(95, 48, 24), new T.ShaderMaterial({vertexShader:skyVS, fragmentShader:skyFS, side:T.BackSide, depthWrite:false,
      uniforms:{top:{value:new T.Color()}, hor:{value:new T.Color()}, sunC:{value:new T.Color()}, sunD:{value:V3(0,0.05,-1)}}})); G.add(this.sky);
    const ground = new T.Mesh(new T.PlaneGeometry(400,400), new T.MeshStandardMaterial({color:0x1a0f1e, roughness:1})); ground.rotation.x = -Math.PI/2; G.add(ground);
    const road = new T.Mesh(new T.PlaneGeometry(7,400), new T.MeshStandardMaterial({color:0x121218, roughness:0.85})); road.rotation.x = -Math.PI/2; road.position.y = 0.01; G.add(road);
    this.dash = []; for(let i=0;i<30;i++){ const d = new T.Mesh(new T.BoxGeometry(0.14,0.02,1.4), new T.MeshBasicMaterial({color:0xf2c14e})); d.position.set(0,0.02,-i*4); this.dash.push(d); G.add(d); }
    this.palms = []; for(let i=0;i<16;i++){ const p = palm(4 + Math.random()*2.5); p.position.set((i%2 ? 1 : -1)*(5 + Math.random()*3), 0, -i*9); this.palms.push(p); G.add(p); }
    this.sunGlow = glowSprite(30, [1,0.6,0.3], 0.9); G.add(this.sunGlow);
    this.sun = new T.Sprite(new T.SpriteMaterial({map:svgTexture(DURAG_SUN), transparent:true, depthWrite:false, fog:false})); this.sun.scale.set(16,16,1); G.add(this.sun);
    this.car = lowrider(); G.add(this.car);
    this.hemi = new T.HemisphereLight(0xffffff, 0x1a0f1e, 0.6); G.add(this.hemi); const fill = new T.PointLight(0xc79bff, 40, 30, 1.6); fill.position.set(2.5, 3.5, 7); G.add(fill); this.keyL = new T.DirectionalLight(0xffffff, 1.4); G.add(this.keyL);
    this.t = 0; this.WL = M.colour.WL;
  },
  enter(){ base(0x0a0612); S3.scene.fog = new T.Fog(0x3a1a2a, 30, 110); this.t = 0; },
  step(dt, S){
    this.t += dt; const h = S.elev, hr = h*Math.PI/180;
    const spec = K.sunSpectrum(h, this.WL), top = K.sunSpectrum(90, this.WL), Lr = M.colour.spec(spec), L0 = M.colour.spec(top);
    const sunRGB = M.colour.norm(Lr), dim = Math.min(1, M.colour.lum(Lr)/M.colour.lum(L0));
    const sd = V3(0, Math.sin(hr), -Math.cos(hr)).normalize(), sunPos = sd.clone().multiplyScalar(85);
    this.sun.position.copy(sunPos); this.sunGlow.position.copy(sunPos); this.sun.material.color.setRGB(sunRGB[0], sunRGB[1], sunRGB[2]); this.sunGlow.material.color.setRGB(sunRGB[0], sunRGB[1]*0.85, sunRGB[2]*0.7);
    const u = this.sky.material.uniforms, warm = Math.max(0, Math.min(1, 1 - h/30));
    u.sunD.value.copy(sd); u.sunC.value.setRGB(sunRGB[0], sunRGB[1], sunRGB[2]);
    u.hor.value.setRGB(0.25 + 0.7*sunRGB[0]*(0.5+0.5*warm), 0.15 + 0.45*sunRGB[1], 0.25 + 0.35*sunRGB[2]);
    u.top.value.setRGB(0.05 + 0.15*(1-warm), 0.06 + 0.25*(1-warm), 0.18 + 0.45*(1-warm));
    S3.scene.fog.color.setRGB(u.hor.value.r*0.6, u.hor.value.g*0.5, u.hor.value.b*0.6);
    this.keyL.position.copy(sunPos); this.keyL.color.setRGB(sunRGB[0], sunRGB[1], sunRGB[2]); this.keyL.intensity = 0.6 + 1.6*dim; this.hemi.color.setRGB(u.hor.value.r, u.hor.value.g, u.hor.value.b);
    const v = 9; for(const d of this.dash){ d.position.z += v*dt; if(d.position.z > 12) d.position.z -= 120; }
    for(const p of this.palms){ p.position.z += v*dt; if(p.position.z > 14) p.position.z -= 144; }
    const cu = this.car.userData; cu.wheels.forEach(w => w.children[2].rotation.x -= v*dt/0.33);
    const hop = S.hop*Math.max(0, Math.sin(this.t*2.6))**3; cu.body.position.y = 0.35*hop; cu.body.rotation.x = 0.16*hop;
    cu.driver.material.color.setRGB(1, 0.95, 0.8); cu.driver.scale.setScalar(1.05 + 0.1*Math.sin(this.t*6));
    const X = K.airmass(Math.max(h,-0.5)), T450 = Math.exp(-K.tauRayleigh(450)*X), T650 = Math.exp(-K.tauRayleigh(650)*X);
    return [['Sun elevation', f(h,1)+'°'], ['airmass X', f(X,2)], ['Rayleigh transmission at 450 nm', f(100*T450,1)+' %'], ['Rayleigh transmission at 650 nm', f(100*T650,1)+' %'],
      ['red-to-blue survival ratio', f(T650/T450,2)], ['computed colour of the Sun', M.colour.hex(sunRGB)]];
  }});

/* ---------- run on the parts, keeping a handle on the stage ---------- */
MIXER.eyes.forEach(e => { const mk = e.make; e.make = function(G, st){ S3 = st; return mk.call(this, G, st); }; });
M.run(MIXER);
})();
