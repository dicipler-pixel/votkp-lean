-wall", "file": "research/2026-11-20-element-paper-loop-wall/lean/LoopWall.lean", "line": 511, "name": "gam_anion_rung"}}, {"id": "wall.omega-eta", "title": "Electrophilicity meets hardness", "statement": "With ω = χ²/2η: ω/η = 1/(2Γ₀²), so the wall Γ₀² = ½ is the plane ω = η. Identity: (I + A)² − 2(I − A)² = −(I² − 6IA + A²). 12 of 65 anions are inside.", "paper": {"title": "The Loop Wall (element paper)", "version": "v8", "section": "§6"}, "lean": {"repo": "dicipler-pixel/votkp-lean", "branch": "element-paper/loop-wall", "file": "research/2026-11-20-element-paper-loop-wall/lean/LoopWall.lean", "theorem": "omega_eta_wall"}, "grade": "PROVED-LEAN", "tags": ["loop-wall", "anion-rung", "chemistry"], "links": [{"to": "wall.definition", "kind": "same-wall"}], "lean_status": "found", "lean_found": {"where": "votkp-lean@element-paper/loop-wall", "file": "research/2026-11-20-element-paper-loop-wall/lean/LoopWall.lean", "line": 528, "name": "omega_eta_wall"}}, {"id": "wall.heavy-anion-prediction", "title": "Heavy-anion prediction", "statement": "Gold, platinum, iridium, astatine inside; osmium, bismuth, lead outside: all seven hold. Polonium (preliminary affinity 1.476 eV, z = 5.703) is provisionally contradicted.", "paper": {"title": "The Loop Wall (element paper)", "version": "v8", "section": "§6"}, "lean": {"repo": "dicipler-pixel/votkp-lean", "branch": "element-paper/loop-wall", "file": "research/2026-11-20-element-paper-loop-wall/lean/LoopWall.lean", "theorem": "heavy_anion_prediction"}, "grade": "PROVED-LEAN (ratios) · MEASURED", "tags": ["loop-wall", "anion-rung", "prediction"], "links": [], "lean_status": "found", "lean_found": {"where": "votkp-lean@element-paper/loop-wall", "file": "research/2026-11-20-element-paper-loop-wall/lean/LoopWall.lean", "line": 459, "name": "heavy_anion_prediction"}}, {"id": "wall.francium", "title": "Advance prediction: francium", "statement": "Francium's radon-core opening is inside the wall iff IE₂(Fr) < 23.738 eV (IE₁ = 4.072741 eV measured; IE₂ unmeasured). Only IE₂ in [23.654, 23.893) eV separates the exact wall from other allowed cutoffs. Registered 21 Nov 2026.", "paper": {"title": "The Loop Wall (element paper)", "version": "v8", "section": "prediction file"}, "lean": null, "grade": "PREDICTION (untested)", "tags": ["loop-wall", "prediction", "elements"], "links": [{"to": "wall.window", "kind": "uses"}], "lean_status": "no Lean proof cited"}, {"id": "two-trees.schottky-5-7", "title": "Schottky threshold at ratios 5 and 7", "statement": "Γ(5)² < ½ < Γ(7)²: the wall separates the peel boosts of ratio 5 and 7. Proved at these two ratios only; the general threshold is stated in the paper.", "paper": {"title": "Two Trees in One Ball", "version": "v4", "section": "§ Schottky"}, "lean": {"repo": "dicipler-pixel/votkp-lean", "branch": "claude/sm-ball-20261111", "file": "two-trees/lean/PeelTrees.lean", "theorem": "schottky_seven_above"}, "grade": "PROVED-LEAN (two ratios)", "tags": ["loop-wall", "two-trees"], "links": [{"to": "wall.definition", "kind": "same-wall"}], "lean_status": "found", "lean_found": {"where": "votkp-lean@claude/sm-ball-20261111", "file": "two-trees/lean/PeelTrees.lean", "line": 164, "name": "PeelTrees.schottky_seven_above"}}, {"id": "transport.trace-wall", "title": "Loop transport: tr W = −2 at the wall", "statement": "W = A B A⁻¹ B⁻¹ for two perpendicular half-steps: tr W = 2 − 4 sinh²a sinh²b; at Γ² = ½ on both faces the trace is −2, the threshold where transport starts selecting one line.", "paper": {"title": "What Transport Keeps", "version": "ed. 3", "section": "Theorems 1–2 (reading)"}, "lean": {"repo": "dicipler-pixel/votkp-lean", "branch": "claude/sm-ball-20261111", "file": "research/2026-11-12-harness/lean/NewProps.lean", "theorem": "trace_at_wall"}, "grade": "PROVED-LEAN (value at the wall) · COMPUTED (selection)", "tags": ["loop-wall", "transport"], "links": [{"to": "wall.two-faces", "kind": "same-wall"}], "lean_status": "found", "lean_found": {"where": "votkp-lean@c us": "no Lean proof cited"}, {"id": "offset.ladder-4pi", "title": "The entanglement ladder is spaced 4π at the wall", "statement": "Each level of a block is a peel step, z = (1 − ν)/ν. On the dimerised chain ũ = Γ(t₂/t₁); at ũ² = ½ (t₂/t₁ = 3 + 2√2) K = K′ and the spacing Δ = 4πK(ũ)/K′(ũ) is exactly 4π (finite blocks to ~10⁻¹⁹).", "paper": {"title": "The Offset Belongs to the Boundary", "version": "v31", "section": "spacing formula"}, "lean": null, "grade": "DERIVED · MEASURED", "tags": ["loop-wall", "offset", "entanglement"], "links": [{"to": "wall.definition", "kind": "same-wall"}], "lean_status": "no Lean proof cited"}, {"id": "gravity.licence", "title": "The licence is the two-face closing test", "statement": "Γ_a² + Γ_b² < 1 is the rank-one persistence cap / licence: [[1, w],[w̄, 1]] positive with w = Γ_a + iΓ_b. At the anion rung the metric determinant is IE · EA, so the wall lapses before the anion unbinds.", "paper": {"title": "The Ledger Outlives the Metric", "version": "Ed. 7", "section": "Thm 1, Thm 5"}, "lean": null, "grade": "DERIVED · COMPUTED", "tags": ["loop-wall", "gravity"], "links": [{"to": "wall.two-faces", "kind": "same-formula"}], "lean_status": "no Lean proof cited"}, {"id": "vacuum-disk.metals-line", "title": "Metals and non-metals split at |Γ|² = ½", "statement": "Averaged over the visible, the reflection |Γ|² = ½ separates metals (35 of 35 above) from non-metals (0 of 6 above) on the vacuum disk.", "paper": {"title": "The Volume of the Knot Potential: Decay and Direction on the Vacuum Disk", "version": "v6", "section": "§9"}, "lean": null, "grade": "MEASURED (refractiveindex.info data)", "tags": ["loop-wall", "colour", "vacuum-disk"], "links": [{"to": "wall.definition", "kind": "same-wall"}], "lean_status": "no Lean proof cited"}, {"id": "vacuum-disk.polynomial", "title": "The decay–direction polynomial", "statement": "P_K(x) = Π_ρ (x − e^{λV₀(ρ)}), one root per geometry read off the drawing (Cho–Kim–Kim potential): top root = complex volum
