# Refreshes the work atlas from the Lean repos: every 6 hours, on every push to main, and on demand.
name: update-atlas
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['entries/**', 'repos.json', 'update_atlas.py', 'atlas_template.html']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read every Lean repo and rebuild the atlas
        run: python3 update_atlas.py
      - name: Commit the refreshed atlas if anything changed
        run: |
          git config user.name "work-atlas refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas.json ATLAS.html STATUS.md
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Atlas refresh from the Lean repos" && git push; fi
