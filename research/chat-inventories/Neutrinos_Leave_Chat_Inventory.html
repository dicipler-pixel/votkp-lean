$('lGh').innerHTML=gh.map(([n,g])=>li(n,`<a href="https://${esc(g)}" target="_blank" rel="noopener">${esc(g)}</a>`)).join('');

 const tags=[...t.inputs.map(x=>`<span class="tag in">in · ${esc(x)}</span>`),...t.out.map(x=>`<span class="tag out">out · ${esc(x)}</span>`),...t.gh.map(g=>`<a class="tag gh" href="https://${esc(g)}" target="_blank" rel="noopener">${esc(g)}</a>`)].join('');
